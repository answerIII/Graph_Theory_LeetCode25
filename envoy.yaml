# Прокси (Envoy) нужен, чтобы преобразовать gRPC-Web 
# запросы из браузера в нативный gRPC для сервера. 

# port_value: 8080: Envoy слушает запросы от браузера на порту 8080
# port_value: 50051: Envoy перенаправляет запросы к gRPC-серверу на порту 50051
# host.docker.internal: Специальный хост в Docker для доступа к localhost хоста. На Linux замени на 172.17.0.1 или IP контейнера
# cors: Настройка CORS для браузера
# grpc_web: Фильтр для обработки gRPC-Web запросов

# Запуск
# docker run -d -p 8080:8080 -p 9901:9901 -v $(pwd)/envoy.yaml:/etc/envoy/envoy.yaml envoyproxy/envoy:v1.22.0

# Порт 8080: Для gRPC-Web запросов
# Порт 9901: Для админ-панели Envoy (http://localhost:9901 для диагностики)

# Проверить работу Envoy:
# Открыть http://localhost:9901/stats в браузере. Там статистика Envoy
# Убедиться, что gRPC-сервер запущен на localhost:50051

admin:
  access_log_path: /tmp/admin_access.log
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address: { address: 0.0.0.0, port_value: 8080 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          codec_type: auto
          stat_prefix: ingress_http
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route:
                  cluster: grpc_service
                  timeout: 60s
          http_filters:
          - name: envoy.filters.http.grpc_web
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
          - name: envoy.filters.http.cors
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
              cors:
                allow_origin_string_match:
                - safe_regex:
                    regex: ".*"
                allow_methods: "GET,POST,OPTIONS"
                allow_headers: "content-type,authorization,grpc-timeout"
                expose_headers: "grpc-status,grpc-message"
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: grpc_service
    connect_timeout: 0.25s
    type: logical_dns
    lb_policy: round_robin
    load_assignment:
      cluster_name: cluster_0
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: host.docker.internal
                port_value: 50051


# Потенциальные проблемы и решения

# Альтернатива Envoy: Использование Node.js прокси
# Примечание: Node.js прокси менее надёжен, чем Envoy, 
# и может не поддерживать все возможности gRPC-Web (например, CORS)
# Envoy предпочтительнее для продакшена.


# Ошибка CORS: Если браузер жалуется на CORS, убедиться, 
# что envoy.yaml включает корректные настройки CORS (они уже есть в примере).

# Ошибка UNAVAILABLE:
# Проверь, что сервер работает (localhost:50051)
# Убедись, что Envoy правильно маршрутизирует запросы (проверь логи: docker logs <container_id>)